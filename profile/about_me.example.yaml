# About Me template. Copy it, fill in what you want, leave the rest blank:
#
#   cp profile/about_me.example.yaml profile/about_me.yaml
#   anexis aboutme import profile/about_me.yaml
#
# Or skip the file and run `anexis aboutme` to be asked the same things.
# Your filled in copy is ignored by git and never leaves your server.

name:
age:
location:            # city is enough
areas: []            # where you move around: neighborhoods, campus, commute
school:              # school, year, what you study
classes: []          # one per line, e.g. "Chem 101, Mon and Wed 9am, Dr. Lee"
work:                # where and what you do
schedule: []         # fixed things in your week: shifts, practice
projects: []         # what you are building or want to start
habits: []           # routines, good or bad
goals: []
interests: []
people: []           # "Ana, my sister"
tools: []            # languages, apps, devices
talk_style:          # how Anexis should talk to you
avoid: []            # things Anexis should never do or bring up
other: []
