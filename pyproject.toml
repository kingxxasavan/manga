[project]
name = "anexis"
version = "0.3.0"
description = "Anexis: a personal AI assistant server with adaptive SQL memory, tools, code creation and voice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "ddgs>=9.0",
    "psutil>=6.0",
    "websockets>=13",  # the terminal panel talks to the server over a socket
]

[project.optional-dependencies]
# Voice is optional so text chat works without the heavy speech packages.
# Piper (text to speech) is run as its own program, see anexis/voice/tts.py.
voice = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
]
# What the desktop app adds: a real terminal on Windows and control of the
# screen, keyboard, mouse, windows and clipboard.
desktop = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    "pillow>=10",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
]

[project.scripts]
anexis = "anexis.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anexis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Anexis catches broad exceptions on purpose in a few places: a crashing tool or
# a model outage must never take the whole conversation down.
ignore = [
    "E501",      # long lines are fine for tool descriptions
    "B905",      # zip() lengths are checked by the caller here
    "SIM105",    # plain try/except reads clearer than contextlib.suppress
    "SIM115",
    "ASYNC109",  # tool timeouts are passed through to subprocesses on purpose
    "ASYNC110",
    "ASYNC220",  # starting a program that must outlive the call is done with Popen on purpose
    "ASYNC230",  # small local file writes, not worth a thread
    "ASYNC240",
]
