<!doctype html>
<html lang="en" data-theme="tron">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Anexis</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<!-- The deck. Plain files, no build step: edit anything in ui/ and the open
     window reloads by itself. Each panel has its own file in ui/js/. -->

<div id="boot" class="boot" hidden>
  <div class="boot-inner">
    <ol class="boot-log" id="boot-log" aria-hidden="true"></ol>
    <div class="boot-mark" id="boot-name" hidden>ANEXIS</div>
    <ol class="boot-lines" id="boot-lines"></ol>
    <div class="boot-skip">press any key to skip</div>
  </div>
</div>

<div class="deck" id="deck" data-center="chat" data-view="chat">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" id="brand-name">ANEXIS</span>
    </div>
    <label class="mode">
      <span class="sr">Mode</span>
      <select id="mode" title="What kind of help you want right now">
        <option value="general">general</option>
        <option value="school">school</option>
        <option value="work">work</option>
        <option value="project">project</option>
      </select>
    </label>
    <div class="status" id="status" aria-live="polite">
      <span class="stat" id="st-model" title="Which model source is answering"><i class="dot"></i><b>model</b><span>...</span></span>
      <span class="stat" id="st-memory" title="Things Anexis remembers"><b>memory</b><span>0</span></span>
      <span class="stat" id="st-tools" title="Tools Anexis can use"><b>tools</b><span>0</span></span>
    </div>
    <div class="top-actions">
      <button class="pill" id="control" title="Full control: tools run without asking. Ask first: risky tools wait for a yes.">
        <i class="dot"></i><span>control</span>
      </button>
      <button class="stop" id="stop" disabled title="Stop what Anexis is doing right now (Esc)">STOP</button>
      <nav class="menu" aria-label="Screens">
        <button data-open="setup" title="Setup: preset, options, downloads">Setup</button>
        <button data-open="models" title="Which model does which job">Models</button>
        <button data-open="keys" title="API keys, Claude sign in, Canvas">Keys</button>
        <button data-open="doctor" title="Check that every part works">Checkup</button>
        <button data-open="about" title="Tell Anexis about yourself">About me</button>
        <button data-open="app" title="This app: live editing, theme, restart">App</button>
      </nav>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- Left column: the machine. Built by js/stats.js. -->
  <aside class="col col-left" data-panel="system" aria-label="System">
    <div class="col-head"><span>PANEL</span><span>SYSTEM</span></div>
    <div class="col-body" id="system"></div>
  </aside>

  <!-- Middle: the shell. Chat, the terminal, memory and tools share it as tabs. -->
  <section class="shell" aria-label="Main shell">
    <div class="tabs" role="tablist">
      <button role="tab" data-center="chat" aria-selected="true">Chat</button>
      <button role="tab" data-center="terminal" aria-selected="false">Terminal</button>
      <button role="tab" data-center="memory" aria-selected="false">Memory</button>
      <button role="tab" data-center="tools" aria-selected="false">Tools</button>
      <span class="tabs-meta" id="center-meta"></span>
    </div>
    <div class="pane" data-panel="chat" id="chat">
      <div class="chat-bar">
        <span class="chat-title" id="chat-title">New chat</span>
        <span class="grow"></span>
        <button type="button" id="chat-list" title="Your past chats">Chats</button>
        <button type="button" id="chat-new" title="Start a fresh chat. This one is kept under Chats.">New chat</button>
        <button type="button" id="chat-clear" title="Delete this chat. What Anexis learned from it stays.">Clear</button>
      </div>
      <div class="chat-log" id="chat-log" tabindex="0"></div>
      <div class="suggest" id="suggest" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" id="mic" title="Talk instead of typing" aria-label="Talk">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z" fill="currentColor"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Tell Anexis what to do. / for commands" aria-label="Message"></textarea>
        <button type="submit" class="send" id="send">Send</button>
      </form>
    </div>
    <div class="pane" data-panel="terminal" id="terminal">
      <div class="term-bar">
        <span id="term-where"></span>
        <span class="grow"></span>
        <button id="term-new" title="Start a fresh shell">New shell</button>
      </div>
      <div class="term-host" id="term-host"></div>
    </div>
    <div class="pane" data-panel="memory" id="memory"></div>
    <div class="pane" data-panel="tools" id="tools"></div>
  </section>

  <!-- Right column: the network, what Anexis is running on, and its live log. -->
  <aside class="col col-right" data-panel="network" aria-label="Network and activity">
    <div class="col-head"><span>PANEL</span><span>NETWORK</span></div>
    <div class="col-body">
      <div id="network"></div>
      <section class="mod" id="brain">
        <h3><b>Anexis</b><span id="brain-sub">status</span></h3>
        <div class="mod-body" id="brain-body"></div>
      </section>
      <section class="mod mod-grow">
        <h3><b>Activity</b><span id="activity-count">live</span></h3>
        <div class="mod-body scroll" id="activity"></div>
      </section>
    </div>
  </aside>

  <section class="fs" data-panel="files" aria-label="Files">
    <h3><b>Filesystem</b><span id="files-count"></span></h3>
    <div class="fs-body" id="files"></div>
  </section>

  <section class="kb" data-panel="keyboard" id="keyboard" aria-label="On screen keyboard"></section>

  <nav class="views" aria-label="Panels">
    <button data-view="chat">Chat</button>
    <button data-view="terminal">Term</button>
    <button data-view="memory">Memory</button>
    <button data-view="tools">Tools</button>
    <button data-view="system">System</button>
    <button data-view="network">Network</button>
    <button data-view="files">Files</button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header>
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="fx" aria-hidden="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
